
name: Build PIXEL DRIFT APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3.0

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Prepare Android
        run: |
          mkdir -p build ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure export
        run: |
          cat > export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/PIXEL_DRIFT.apk"

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          package/unique_name="com.pixelgarage.pixeldrift"
          version/code=1
          version/name="0.1"
          screen/immersive_mode=true
          EOF

      - name: Build APK
        run: |
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          godot --headless --editor --path . --quit
          godot --headless --path . --export-debug "Android" build/PIXEL_DRIFT.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PIXEL-DRIFT-APK
          path: build/PIXEL_DRIFT.apk
